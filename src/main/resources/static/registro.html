<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta | Mars Spins</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/registro.css" />
</head>
<body>

  <div class="auth-card">

    <span class="brand-label">Mars Spins</span>

    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Ruleta, blackjack y dados en un solo lugar.</p>

    <form id="form-registro">
      <div class="form-group">
        <label class="field-label" for="usuario">Usuario</label>
        <input class="field-input" id="usuario" type="text" placeholder="Tu usuario" required />
      </div>

      <div class="form-group">
        <label class="field-label" for="correo">Correo</label>
        <input class="field-input" id="correo" type="email" placeholder="tu@correo.com" />
      </div>

      <div class="form-group">
        <label class="field-label" for="password">Contraseña</label>
        <input class="field-input" id="password" type="password" placeholder="Mínimo 8 caracteres" required />
      </div>

      <div class="form-group">
        <label class="field-label" for="confirmar">Confirmar contraseña</label>
        <input class="field-input" id="confirmar" type="password" placeholder="Repite tu contraseña" required />
      </div>

      <p class="form-error" id="error"></p>

      <div class="form-actions">
        <button class="btn-gold" type="submit">
          Crear cuenta
        </button>
      </div>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>

  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        await api('/api/registro', {
          usuario: document.getElementById('usuario').value,
          correo: document.getElementById('correo').value,
          contrasena: document.getElementById('password').value,
          confirmar: document.getElementById('confirmar').value
        });
        window.location.href = 'principal.html';
      } catch (err) {
        error.textContent = err.message;
      }
    });
  </script>
</body>
</html>
